name: kanvy

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtasks123}
      POSTGRES_DB: ${POSTGRES_DB:-devtasks}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtasks} -d ${POSTGRES_DB:-devtasks}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5001}:5001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devtasks}:${POSTGRES_PASSWORD:-devtasks123}@postgres:5432/${POSTGRES_DB:-devtasks}?schema=public
      PORT: "5001"
      STATIC_DIR: /app/frontend/dist
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5001}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.docker}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      UPLOADS_SECRET: ${UPLOADS_SECRET:-}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:-}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_ALLOWED_BASE_URLS: ${AI_ALLOWED_BASE_URLS:-}
      AI_IMPORT_MAX_TOKENS: ${AI_IMPORT_MAX_TOKENS:-7168}
    volumes:
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  uploads:
